<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>

<style>
body {
    margin: 0;
    background: #fff;
    font-family: Arial, sans-serif;
}

.calculator {
    max-width: 400px;
    margin: auto;
    padding: 15px;
}

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #888;
    font-size: 22px;
}

.display {
    text-align: right;
    font-size: 48px;
    padding: 20px 5px;
    overflow-x: auto;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

button {
    height: 65px;
    font-size: 22px;
    border: none;
    border-radius: 12px;
    background: #f2f2f2;
    cursor: pointer;
}

.operator {
    color: orange;
    font-weight: bold;
}

.equal {
    background: orange;
    color: #fff;
    font-size: 26px;
}

button:active {
    transform: scale(0.95);
}

.history {
    display: none;
    margin-top: 10px;
    font-size: 14px;
    color: #555;
}

.history div {
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid #eee;
    padding: 4px 0;
}
</style>
</head>

<body>

<div class="calculator">

    <div class="top-bar">
        <span>?</span>
        <span onclick="toggleHistory()">🕘</span>
    </div>

    <div id="display" class="display">0</div>

    <div id="history" class="history"></div>

    <div class="buttons">
        <button class="operator" onclick="clearAll()">AC</button>
        <button class="operator" onclick="backspace()">⌫</button>
        <button class="operator" onclick="press('%')">%</button>
        <button class="operator" onclick="press('/')">÷</button>

        <button onclick="press('7')">7</button>
        <button onclick="press('8')">8</button>
        <button onclick="press('9')">9</button>
        <button class="operator" onclick="press('*')">×</button>

        <button onclick="press('4')">4</button>
        <button onclick="press('5')">5</button>
        <button onclick="press('6')">6</button>
        <button class="operator" onclick="press('-')">−</button>

        <button onclick="press('1')">1</button>
        <button onclick="press('2')">2</button>
        <button onclick="press('3')">3</button>
        <button class="operator" onclick="press('+')">+</button>

        <button onclick="press('0')">0</button>
        <button onclick="press('.')">.</button>
        <button class="equal" style="grid-column: span 2" onclick="calculate()">=</button>
    </div>

</div>

<script>
let display = document.getElementById("display");
let historyBox = document.getElementById("history");

function press(val) {
    if (display.innerText === "0") display.innerText = "";

    // ✅ ONLY FIX FOR GUNA
    if (val === "*") {
        display.innerText += "×";
    } else {
        display.innerText += val;
    }
}

function clearAll() {
    display.innerText = "0";
}

function backspace() {
    display.innerText = display.innerText.slice(0, -1) || "0";
}

function calculate() {
    try {
        let exp = display.innerText.replace(/×/g, "*");
        let result = eval(exp);
        addHistory(display.innerText + " = " + result);
        display.innerText = result;
    } catch {
        display.innerText = "Error";
    }
}

function addHistory(text) {
    let div = document.createElement("div");
    div.innerHTML = `<span>${text}</span><span onclick="this.parentElement.remove()">❌</span>`;
    historyBox.prepend(div);
}

function toggleHistory() {
    historyBox.style.display =
        historyBox.style.display === "block" ? "none" : "block";
}
</script>

</body>
</html>
