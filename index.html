<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scientific Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1976d2">

<style>
*{box-sizing:border-box;}
body{
  margin:0;
  background:#fff;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial, sans-serif;
}
.app{
  width:100%;
  max-width:360px;
  background:#fff;
}
.display{
  padding:14px;
  border-bottom:1px solid #ddd;
}
.expression{
  font-size:22px;
  color:#1976d2;
  text-align:right;
  min-height:28px;
  white-space:nowrap;
  overflow-x:auto;
}
.result{
  font-size:28px;
  text-align:right;
  margin-top:6px;
}
.history{
  display:none;
  max-height:140px;
  overflow:auto;
  font-size:14px;
  border-bottom:1px solid #ddd;
}
.history div{
  display:flex;
  justify-content:space-between;
  padding:6px 8px;
  border-bottom:1px solid #eee;
}
.history button{
  width:100%;
  border:none;
  padding:8px;
  background:#e53935;
  color:#fff;
  cursor:pointer;
}
.icon-bar{
  display:flex;
  justify-content:space-around;
  padding:10px 0;
  border-bottom:1px solid #ddd;
}
.buttons{
  display:grid;
  grid-template-columns:repeat(5,1fr);
}
.btn{
  border:1px solid #eee;
  min-height:52px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
  cursor:pointer;
  user-select:none;
}
.op{color:#1976d2;font-weight:bold;}
.equal{
  background:#1976d2;
  color:#fff;
  grid-column:5;
  grid-row:6/span 2;
  font-size:22px;
}
</style>
</head>

<body>
<div class="app">

<div class="display">
  <div class="expression" id="exp"></div>
  <div class="result" id="res">0</div>
</div>

<div class="history" id="history">
  <button onclick="clearHistory()">Delete All</button>
  <div id="historyList"></div>
</div>

<div class="icon-bar">
  <div onclick="toggleHistory()">🕒</div>
  <div>📏</div>
  <div onclick="toggleSign()">±</div>
  <div>⚙️</div>
  <div onclick="back()">⌫</div>
</div>

<div class="buttons">
  <div class="btn">Rad</div>
  <div class="btn" onclick="func('sin')">sin</div>
  <div class="btn" onclick="func('cos')">cos</div>
  <div class="btn" onclick="func('tan')">tan</div>
  <div class="btn op" onclick="add('/')">÷</div>

  <div class="btn" onclick="add('Math.PI')">π</div>
  <div class="btn" onclick="func('ln')">ln</div>
  <div class="btn" onclick="func('log')">log</div>
  <div class="btn" onclick="func('inv')">1/x</div>
  <div class="btn op" onclick="add('×')">×</div>

  <div class="btn" onclick="add('**2')">x²</div>
  <div class="btn" onclick="clearAll()">C</div>
  <div class="btn" onclick="add('(')">(</div>
  <div class="btn" onclick="add(')')">)</div>
  <div class="btn op" onclick="add('-')">−</div>

  <div class="btn" onclick="add('7')">7</div>
  <div class="btn" onclick="add('8')">8</div>
  <div class="btn" onclick="add('9')">9</div>
  <div class="btn equal" onclick="calculate()">=</div>

  <div class="btn" onclick="add('4')">4</div>
  <div class="btn" onclick="add('5')">5</div>
  <div class="btn" onclick="add('6')">6</div>
  <div class="btn op" onclick="add('+')">+</div>

  <div class="btn" onclick="add('1')">1</div>
  <div class="btn" onclick="add('2')">2</div>
  <div class="btn" onclick="add('3')">3</div>

  <div class="btn" onclick="add('0')">0</div>
  <div class="btn" onclick="add('00')">00</div>
  <div class="btn" onclick="add('.')">.</div>
</div>
</div>

<script>
let exp="";
let historyArr=[];

/* 🔥 AUTO CALCULATION */
function calculateAuto(){
  try{
    if(!exp){
      document.getElementById("res").innerText="0";
      return;
    }
    let r = eval(exp.replace(/×/g,"*"));
    if(isFinite(r)){
      document.getElementById("res").innerText=r;
    }
  }catch{
    // silent
  }
}

function add(v){
  exp+=v;
  document.getElementById("exp").innerText=exp;
  calculateAuto(); // 🔥 magic
}

function calculate(){
  try{
    let r = eval(exp.replace(/×/g,"*"));
    document.getElementById("res").innerText=r;
    historyArr.unshift(exp+" = "+r);
    renderHistory();
  }catch{
    document.getElementById("res").innerText="Error";
  }
}

function clearAll(){
  exp="";
  document.getElementById("exp").innerText="";
  document.getElementById("res").innerText="0";
}

function back(){
  exp=exp.slice(0,-1);
  document.getElementById("exp").innerText=exp;
  calculateAuto();
}

function toggleSign(){
  if(exp){
    exp="(-1*("+exp+"))";
    document.getElementById("exp").innerText=exp;
    calculateAuto();
  }
}

function func(f){
  if(!exp) return;
  if(f==="sin") exp="Math.sin("+exp+")";
  if(f==="cos") exp="Math.cos("+exp+")";
  if(f==="tan") exp="Math.tan("+exp+")";
  if(f==="ln") exp="Math.log("+exp+")";
  if(f==="log") exp="Math.log10("+exp+")";
  if(f==="inv") exp="1/("+exp+")";
  document.getElementById("exp").innerText=exp;
  calculateAuto();
}

function toggleHistory(){
  let h=document.getElementById("history");
  h.style.display=h.style.display==="block"?"none":"block";
}

function renderHistory(){
  document.getElementById("historyList").innerHTML=
    historyArr.map(x=>`<div>${x}</div>`).join("");
}

function clearHistory(){
  historyArr=[];
  renderHistory();
}

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
