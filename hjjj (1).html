<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
<title>Scientific Calculator – PaisaTrack</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL@0..1" />
<style>
.icon-btn {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: none;
  background: transparent;
  
  display: flex;
  align-items: center;
  justify-content: center;
  
  cursor: pointer;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
* { -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }

/* ========== THEME VARIABLES – LIGHT MODE ========== */
:root {
  --bg: #ffffff;
  --card: #ffffff;
  --surf: #f5f5f5;
  --dim: #ececec;
  --dim2: #e0e0e0;
  --accent: #FF6D3F;
  --accent2: #E85A2E;
  --sub: #9a9a9a;
  --text: #1a1a1a;
  --fh: 'Sora', sans-serif;
  --fb: 'DM Sans', sans-serif;
  --fm: 'DM Mono', monospace;
}

/* ========== DARK MODE ========== */
body.dark {
  --bg: #000000;
  --card: #000000;
  --surf: #111111;
  --dim: #1c1c1c;
  --dim2: #262626;
  --accent: #5CFF78;
  --accent2: #FF6D3F;
  --sub: #6b6b6b;
  --text: #f0f0f0;
}

html { height: 100%; }
body {
  background: var(--bg);
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  font-family: var(--fb);
  -webkit-font-smoothing: antialiased;
  transition: background 0.2s, color 0.2s;
}

/* ── WRAPPER ── */
.calc-app {
  width: 100%;
  max-width: 440px;
  background: var(--card);
  min-height: 100vh;
  transition: background 0.2s;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* ── TOPBAR ── */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px;
  background: var(--card);
  flex-shrink: 0;
}
.icon-btn {
  width: 38px; height: 38px; border-radius: 50%;
  background: transparent; border: none;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0; transition: background .15s;
}
.icon-btn:active { background: var(--dim); }
.icon-btn .material-symbols-outlined { font-size: 22px; color: var(--text); }
.topbar-spacer { flex: 1; }

/* ── SCI FUNCTIONS STRIP (collapsible) ── */
.sci-strip {
  display: none;
  grid-template-columns: repeat(5, 1fr);
  gap: 1px;
  background: var(--dim);
  flex-shrink: 0;
}
.sci-strip.show { display: grid; }
.sci-btn {
  background: var(--surf);
  min-height: 46px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600; color: var(--accent);
  cursor: pointer; border: none; font-family: var(--fb);
  transition: background .1s;
}
.sci-btn:active { background: var(--dim2); }

/* ── DISPLAY AREA ── */
.display-area {
  padding: 0 20px 18px;
  background: var(--card);
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  transition: background 0.2s;
  flex: 1;
  min-height: 140px;
}
.expression {
  font-family: var(--fm);
  font-size: 14px;
  font-weight: 400;
  color: var(--sub);
  text-align: right;
  min-height: 20px;
  max-height: 44px;
  overflow-y: auto;
  word-break: break-all;
  overflow-wrap: break-word;
  margin-bottom: 6px;
  letter-spacing: .01em;
  line-height: 1.3;
  scrollbar-width: none;
}
.expression::-webkit-scrollbar { display: none; }

.result {
  font-family: var(--fb);
  font-size: 44px;
  font-weight: 400;
  text-align: right;
  color: var(--text);
  letter-spacing: -.5px;
  line-height: 1.1;
  word-break: break-all;
  overflow-wrap: break-word;
  max-height: 52px;
  overflow: hidden;
  transition: font-size 0.15s ease;
}

.display-divider {
  height: 1px;
  background: var(--dim);
  margin: 0 20px;
  flex-shrink: 0;
}

/* ── BUTTON GRID ── */
.button-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 2px;
  background: var(--card);
  flex-shrink: 0;
  padding: 4px 6px 10px;
}

.btn {
  background: var(--card);
  min-height: 62px;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; font-weight: 400;
  cursor: pointer; transition: background .08s, transform .08s;
  color: var(--text); border: none;
  font-family: var(--fb);
  border-radius: 50%;
  margin: 2px auto;
  width: 62px; height: 62px;
}
.btn:active { background: var(--dim); transform: scale(.94); }

.top-row-btn { font-size: 19px; color: var(--accent); font-weight: 600; }
.op-btn { color: var(--accent); font-weight: 500; font-size: 26px; }
.num-btn { color: var(--text); font-size: 25px; }

.equal-btn {
  background: var(--accent);
  color: #fff; font-weight: 500; font-size: 26px;
}
.equal-btn:active { background: var(--accent2); }

.ghost-btn { color: var(--sub); }
.ghost-btn .material-symbols-outlined { font-size: 22px; color: var(--sub); }

/* ── HISTORY OVERLAY (full page) ── */
.history-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: var(--card);
  flex-direction: column;
  max-width: 440px;
  margin: 0 auto;
}
.history-overlay.show { display: flex; }
.history-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 8px;
  flex-shrink: 0;
}
.history-header h2 {
  font-family: var(--fb); font-size: 19px; font-weight: 500;
  color: var(--text);
}
#historyList {
  flex: 1;
  overflow-y: auto;
  padding: 8px 20px;
}
#historyList .entry {
  text-align: right;
  padding: 14px 0;
}
#historyList .entry .exp {
  font-family: var(--fm); font-size: 14px; color: var(--sub);
  word-break: break-all; line-height: 1.4;
}
#historyList .entry .res {
  font-family: var(--fm); font-size: 15px; color: var(--text);
  word-break: break-all; line-height: 1.4; margin-top: 2px;
}
.history-empty {
  color: var(--sub); text-align: center; padding: 40px 0;
  font-family: var(--fb); font-size: 14px;
}
.history-bottom {
  border-top: 1px solid var(--dim);
  padding: 16px 20px;
  flex-shrink: 0;
  cursor: pointer;
}
.history-bottom .res {
  font-family: var(--fb); font-size: 34px; color: var(--text);
  text-align: right; word-break: break-all;
}

@media (max-width: 380px) {
  .btn { width: 56px; height: 56px; min-height: 56px; font-size: 22px; }
  .result { font-size: 36px; }
  .sci-btn { font-size: 12px; min-height: 42px; }
}
</style>
</head>
<body>

<div class="calc-app">

  <!-- TOPBAR -->
  <div class="topbar">
    <button class="icon-btn" id="backBtn">
      <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <div class="topbar-spacer"></div>
    <button class="icon-btn" id="historyToggleBtn">
      <span class="material-symbols-outlined">history</span>
    </button>
  </div>

  <!-- SCI FUNCTIONS STRIP -->
  <div class="sci-strip" id="sciStrip">
    <div class="sci-btn" data-func="sin">sin</div>
    <div class="sci-btn" data-func="cos">cos</div>
    <div class="sci-btn" data-func="tan">tan</div>
    <div class="sci-btn" data-func="ln">ln</div>
    <div class="sci-btn" data-func="log">log</div>
    <div class="sci-btn" data-func="sqrt">√</div>
    <div class="sci-btn" data-func="sq">x²</div>
    <div class="sci-btn" data-func="inv">1/x</div>
    <div class="sci-btn" data-val="PI">π</div>
    <div class="sci-btn" data-val="(">( )</div>
  </div>

  <!-- DISPLAY -->
  <div class="display-area">
    <div class="expression" id="expressionDisplay"></div>
    <div class="result" id="resultDisplay">0</div>
  </div>
  <div class="display-divider"></div>

  <!-- BUTTON GRID -->
  <div class="button-grid">
    <div class="btn top-row-btn" id="clearAllBtn">AC</div>
    <div class="btn top-row-btn ghost-btn" id="backspaceBtn">
      <span class="material-symbols-outlined">backspace</span>
    </div>
    <div class="btn top-row-btn" id="toggleSignBtn">+/−</div>
    <div class="btn op-btn" data-op="/">÷</div>

    <div class="btn num-btn" data-val="7">7</div>
    <div class="btn num-btn" data-val="8">8</div>
    <div class="btn num-btn" data-val="9">9</div>
    <div class="btn op-btn" data-op="×">×</div>

    <div class="btn num-btn" data-val="4">4</div>
    <div class="btn num-btn" data-val="5">5</div>
    <div class="btn num-btn" data-val="6">6</div>
    <div class="btn op-btn" data-op="-">−</div>

    <div class="btn num-btn" data-val="1">1</div>
    <div class="btn num-btn" data-val="2">2</div>
    <div class="btn num-btn" data-val="3">3</div>
    <div class="btn op-btn" data-op="+">+</div>

    <div class="btn ghost-btn" id="sciToggleBtn">
      <span class="material-symbols-outlined">functions</span>
    </div>
    <div class="btn num-btn" data-val="0">0</div>
    <div class="btn num-btn" data-val=".">.</div>
    <div class="btn equal-btn" id="equalBtn">=</div>
  </div>

</div>

<!-- HISTORY OVERLAY -->
<div class="history-overlay" id="historyOverlay">
  <div class="history-header">
    <button class="icon-btn" id="historyBackBtn">
      <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <h2>History</h2>
    <button class="icon-btn" id="clearHistoryBtn">
      <span class="material-symbols-outlined">delete</span>
    </button>
  </div>
  <div id="historyList"></div>
  <div class="history-bottom" id="historyBottom">
    <div class="res" id="historyBottomResult">0</div>
  </div>
</div>

<script>
// ========== THEME SYNC ==========
function applyTheme() {
  const savedTheme = localStorage.getItem('ptTheme');
  if (savedTheme === 'dark') {
    document.body.classList.add('dark');
  } else {
    document.body.classList.remove('dark');
  }
}
window.addEventListener('storage', function(e) {
  if (e.key === 'ptTheme') {
    if (e.newValue === 'dark') document.body.classList.add('dark');
    else document.body.classList.remove('dark');
  }
});
applyTheme();

var expr = '';
var justCalc = false;
var calcHistory = [];

var exprDiv   = document.getElementById('expressionDisplay');
var resultDiv = document.getElementById('resultDisplay');
var histOverlay = document.getElementById('historyOverlay');
var histList  = document.getElementById('historyList');
var histBottomRes = document.getElementById('historyBottomResult');
var sciStrip = document.getElementById('sciStrip');

/* ── SCALE RESULT FONT BASED ON LENGTH ── */
function scaleResultFont(text) {
  var len = text.length;
  var base = 44;
  if (len <= 8) base = 44;
  else if (len <= 10) base = 38;
  else if (len <= 13) base = 32;
  else if (len <= 16) base = 27;
  else if (len <= 20) base = 22;
  else if (len <= 25) base = 18;
  else base = 15;
  var isSmall = window.innerWidth <= 380;
  if (isSmall) base = Math.max(base - 4, 14);
  resultDiv.style.fontSize = base + 'px';
}

/* ── DISPLAY UPDATE ── */
function updateDisplay() {
  exprDiv.innerText = expr || '';
  if (!expr.trim()) {
    resultDiv.innerText = '0';
    scaleResultFont('0');
    histBottomRes.innerText = '0';
    exprDiv.scrollTop = exprDiv.scrollHeight;
    return;
  }
  try {
    var e = prepExpr(expr);
    var v = Function('"use strict"; return (' + e + ')')();
    if (isFinite(v) && !isNaN(v)) {
      var str = String(parseFloat(v.toFixed(10)));
      resultDiv.innerText = str;
      scaleResultFont(str);
    } else {
      resultDiv.innerText = '...';
      scaleResultFont('...');
    }
  } catch(err) {
    resultDiv.innerText = expr ? '...' : '0';
    scaleResultFont(resultDiv.innerText);
  }
  histBottomRes.innerText = resultDiv.innerText;
  exprDiv.scrollTop = exprDiv.scrollHeight;
}

/* convert display operators to JS */
function prepExpr(s) {
  return s
    .replace(/×/g, '*')
    .replace(/÷/g, '/')
    .replace(/−/g, '-')
    .replace(/π/g, '(Math.PI)')
    .replace(/PI/g, '(Math.PI)');
}

/* ── ADD TOKEN ── */
function add(token, isOp) {
  if (justCalc) {
    if (!isOp) { expr = token; }
    else       { expr = resultDiv.innerText !== 'Error' && resultDiv.innerText !== '...' ? resultDiv.innerText : '0'; expr += token; }
    justCalc = false;
  } else {
    expr += token;
  }
  updateDisplay();
}

/* ── FUNCTIONS ── */
function applyFunc(fn) {
  if (justCalc) {
    expr = resultDiv.innerText !== 'Error' && resultDiv.innerText !== '...' ? resultDiv.innerText : '0';
    justCalc = false;
  }
  var base = expr || '0';
  switch(fn) {
    case 'sin':  expr = 'Math.sin('  + base + ')'; break;
    case 'cos':  expr = 'Math.cos('  + base + ')'; break;
    case 'tan':  expr = 'Math.tan('  + base + ')'; break;
    case 'ln':   expr = 'Math.log('  + base + ')'; break;
    case 'log':  expr = 'Math.log10('+ base + ')'; break;
    case 'sqrt': expr = 'Math.sqrt(' + base + ')'; break;
    case 'inv':  expr = '1/('        + base + ')'; break;
    case 'sq':   expr = '('          + base + ')**2'; break;
  }
  updateDisplay();
}

/* ── EVALUATE ── */
function evaluate() {
  if (!expr.trim()) return;
  try {
    var e = prepExpr(expr);
    var raw = Function('"use strict"; return (' + e + ')')();
    if (!isFinite(raw) || isNaN(raw)) throw new Error('Invalid');
    var res = String(parseFloat(raw.toFixed(10)));
    calcHistory.unshift({ exp: expr, res: res });
    if (calcHistory.length > 30) calcHistory.pop();
    renderHistory();
    resultDiv.innerText = res;
    scaleResultFont(res);
    expr = res;
    exprDiv.innerText = expr;
    justCalc = true;
    histBottomRes.innerText = res;
  } catch(err) {
    resultDiv.innerText = 'Error';
    scaleResultFont('Error');
    justCalc = false;
  }
}

/* ── BACKSPACE ── */
function backspace() {
  if (justCalc) { expr = ''; justCalc = false; }
  else          { expr = expr.slice(0, -1); }
  updateDisplay();
}

/* ── CLEAR ── */
function clearAll() {
  expr = ''; justCalc = false;
  resultDiv.innerText = '0';
  scaleResultFont('0');
  exprDiv.innerText = '';
  histBottomRes.innerText = '0';
}

/* ── TOGGLE SIGN ── */
function toggleSign() {
  if (justCalc) {
    expr = resultDiv.innerText !== 'Error' && resultDiv.innerText !== '...' ? resultDiv.innerText : '0';
    justCalc = false;
  }
  if (!expr) return;
  expr = '(-1*(' + expr + '))';
  updateDisplay();
}

/* ── HISTORY ── */
function renderHistory() {
  if (!calcHistory.length) {
    histList.innerHTML = '<div class="history-empty">No history yet</div>';
    return;
  }
  histList.innerHTML = calcHistory.map(function(h){
    return '<div class="entry"><div class="exp">' + esc(h.exp) + '</div><div class="res">= ' + esc(h.res) + '</div></div>';
  }).join('');
}

function clearHistory() { calcHistory = []; renderHistory(); }

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ── RESIZE HANDLER ── */
function handleResize() {
  var cur = resultDiv.innerText || '0';
  scaleResultFont(cur);
}

/* ── BIND BUTTONS ── */
document.querySelectorAll('.btn[data-val], .sci-btn[data-val]').forEach(function(btn) {
  btn.addEventListener('click', function() {
    var v = btn.getAttribute('data-val');
    if (v === 'PI') add('π', false);
    else add(v, false);
  });
});

document.querySelectorAll('.btn[data-op]').forEach(function(btn) {
  btn.addEventListener('click', function() {
    add(btn.getAttribute('data-op'), true);
  });
});

document.querySelectorAll('.sci-btn[data-func]').forEach(function(btn) {
  btn.addEventListener('click', function() {
    applyFunc(btn.getAttribute('data-func'));
  });
});

document.getElementById('equalBtn').addEventListener('click', evaluate);
document.getElementById('clearAllBtn').addEventListener('click', clearAll);
document.getElementById('backspaceBtn').addEventListener('click', backspace);
document.getElementById('toggleSignBtn').addEventListener('click', toggleSign);

document.getElementById('sciToggleBtn').addEventListener('click', function() {
  sciStrip.classList.toggle('show');
});

document.getElementById('historyToggleBtn').addEventListener('click', function() {
  histOverlay.classList.add('show');
});
document.getElementById('historyBackBtn').addEventListener('click', function() {
  histOverlay.classList.remove('show');
});
document.getElementById('historyBottom').addEventListener('click', function() {
  histOverlay.classList.remove('show');
});
document.getElementById('clearHistoryBtn').addEventListener('click', clearHistory);

document.getElementById('backBtn').addEventListener('click', function() {
  if (window.history && window.history.length > 1) window.history.back();
});

window.addEventListener('resize', handleResize);

/* ── KEYBOARD ── */
document.addEventListener('keydown', function(e) {
  if (/^[0-9]$/.test(e.key))       { add(e.key, false); e.preventDefault(); }
  else if (e.key === '.')           { add('.', false); e.preventDefault(); }
  else if (e.key === '+')           { add('+', true);  e.preventDefault(); }
  else if (e.key === '-')           { add('-', true);  e.preventDefault(); }
  else if (e.key === '*')           { add('×', true);  e.preventDefault(); }
  else if (e.key === '/')           { add('/', true);  e.preventDefault(); }
  else if (e.key === '(')           { add('(', false); e.preventDefault(); }
  else if (e.key === ')')           { add(')', false); e.preventDefault(); }
  else if (e.key === 'Enter')       { evaluate();  e.preventDefault(); }
  else if (e.key === 'Backspace')   { backspace(); e.preventDefault(); }
  else if (e.key === 'Escape')      { clearAll();  e.preventDefault(); }
});

/* init */
renderHistory();
updateDisplay();
</script>
</body>
</html>
